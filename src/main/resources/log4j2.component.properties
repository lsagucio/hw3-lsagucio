# Apache POI depends on the Log4j API. No logging backend is bundled, so point the API at its built-in
# SimpleLogger (silenced) to avoid the "could not find a logging provider" error on startup.
log4j2.loggerContextFactory=org.apache.logging.log4j.simple.SimpleLoggerContextFactory
log4j2.simplelogLevel=OFF
log4j2.simplelogStatusLoggerLevel=OFF
log4j2.StatusLogger.level=OFF
